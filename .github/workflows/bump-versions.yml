name: Bump ABCpdf / .NET Version

on:
  workflow_dispatch:
    inputs:
      abcpdf_version:
        description: "New ABCpdf NuGet package version (e.g. 14.0.6)"
        required: true
        type: string
        default: "14.0.5"
      dotnet_version:
        description: "New .NET version (e.g. 10.0 or 11.0)"
        required: true
        type: string
        default: "10.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      # A PAT (not the default GITHUB_TOKEN) is required here: PRs opened with GITHUB_TOKEN do not
      # trigger other workflows' `pull_request` events, so "Build and Test" would never run on it.
      # Add a repo secret named REPO_PAT (classic PAT with `repo` scope, or fine-grained
      # Contents: read/write + Pull requests: read/write) for this workflow to work.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Update ABCpdf package versions
        run: |
          sed -i -E 's/(Include="ABCpdf" Version=")[^"]+(")/\1${{ inputs.abcpdf_version }}\2/' Directory.Build.props
          sed -i -E 's/(Include="ABCpdf\.ABCChrome146\.Linux" Version=")[^"]+(")/\1${{ inputs.abcpdf_version }}\2/' ABCpdfLinuxContainer/ABCpdfLinuxContainer.csproj

      - name: Update ABCpdf Docker base image tag
        run: |
          major="$(cut -d. -f1 <<< '${{ inputs.abcpdf_version }}')"
          sed -i -E "s#(FROM abcpdf/abcpdf:)[0-9]+#\1${major}#" ABCpdfLinuxContainer/Dockerfile

      - name: Update .NET target framework and SDK image
        run: |
          sed -i -E 's/(<TargetFramework>net)[0-9]+\.[0-9]+(<\/TargetFramework>)/\1${{ inputs.dotnet_version }}\2/' ABCpdfLinuxContainer/ABCpdfLinuxContainer.csproj
          sed -i -E 's/(<TargetFramework>net)[0-9]+\.[0-9]+(<\/TargetFramework>)/\1${{ inputs.dotnet_version }}\2/' ABCpdfLinuxContainer.Tests/ABCpdfLinuxContainer.Tests.csproj
          sed -i -E "s#(mcr\.microsoft\.com/dotnet/sdk:)[0-9]+\.[0-9]+#\1${{ inputs.dotnet_version }}#" ABCpdfLinuxContainer/Dockerfile

      - name: Fail if nothing changed
        run: |
          if git diff --quiet; then
            echo "No changes were made - check the version inputs against the current versions." >&2
            exit 1
          fi

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          branch="bump/abcpdf-${{ inputs.abcpdf_version }}-dotnet-${{ inputs.dotnet_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Bump ABCpdf to ${{ inputs.abcpdf_version }} and .NET to ${{ inputs.dotnet_version }}"
          git push origin "$branch"
          gh pr create \
            --title "Bump ABCpdf to ${{ inputs.abcpdf_version }} and .NET to ${{ inputs.dotnet_version }}" \
            --body "Automated version bump via the **Bump ABCpdf / .NET Version** workflow.

          Updates:
          - \`ABCpdf\` and \`ABCpdf.ABCChrome146.Linux\` package versions in \`Directory.Build.props\`
          - \`TargetFramework\` in both \`.csproj\` files
          - the \`abcpdf/abcpdf\` and \`mcr.microsoft.com/dotnet/sdk\` base image tags in the Dockerfile

          Not touched: the \`ABCChrome146\` folder/path references in the Dockerfile, since that number tracks the bundled Chrome build and isn't derivable from the ABCpdf version alone - check ABCpdf's own release notes and update those manually if needed." \
            --base master \
            --head "$branch"
