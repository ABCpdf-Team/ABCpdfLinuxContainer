name: Auto-Approve Automated PRs

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'pull_request_target' && github.event.workflow_run.actor.login == 'dependabot[bot]') ||
        (github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'bump/'))
      )
    runs-on: ubuntu-latest
    steps:
      # Uses the default GITHUB_TOKEN (github-actions[bot]) rather than REPO_PAT deliberately:
      # a "bump/*" PR is opened as whichever account owns REPO_PAT, and GitHub refuses to let an
      # account approve its own pull request, so approval must come from a different identity.
      - name: Approve the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve \
            --repo "${{ github.repository }}" \
            "${{ github.event.workflow_run.pull_requests[0].number }}"
